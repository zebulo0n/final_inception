server.document-root = "/var/www"
server.port           = 8080
server.bind           = "0.0.0.0"

index-file.names       = ( "index.html" )

mimetype.assign        = (
    ".html" => "text/html",
    ".css"  => "text/css",
    ".js"   => "application/javascript",
    ".png"  => "image/png",
    ".jpg"  => "image/jpeg"
)

server.errorlog        = "/dev/stderr"